name: supplysync

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplysync}
      POSTGRES_USER: ${POSTGRES_USER:-supplysync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supplysync}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supplysync} -d ${POSTGRES_DB:-supplysync}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://supplysync:supplysync@db:5432/supplysync}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Krasnoyarsk}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
